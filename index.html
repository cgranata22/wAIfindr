<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>wAIfindr live map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--paper:#F2F4F7;--surface:#fff;--ink:#101B33;--muted:#566178;--line:#D8DEE7;--accent:#FFC531;--brand:#1D3FA0;
 --c-sight:#3348D6;--c-museum:#0B8480;--c-food:#D2452B;--c-cafe:#9A5B13;--c-shop:#B02A86;--c-park:#2E7D32;--c-transit:#4A5568;--c-area:#6B3FC4;--c-stay:#0E6BA8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;font-size:16px;line-height:1.45}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;flex-direction:column;gap:8px;z-index:1000}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:1.2rem;letter-spacing:-.02em;white-space:nowrap}
.logo b{background:var(--accent);padding:0 .2em;border-radius:5px;margin:0 .05em}
.trip{flex:1;min-width:0;font-weight:600;font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select,button{font:inherit;color:inherit}
select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-height:40px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:34px}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#map{flex:1;min-height:0;background:#E4E9EF}
.pin{border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(16,27,51,.45);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.pin.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--ink),0 2px 6px rgba(16,27,51,.5)}
.me{width:16px;height:16px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
#card{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:1000;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 24px rgba(16,27,51,.22);max-width:520px;margin:0 auto;display:none}
#card.on{display:block}
#card h2{margin:0 28px 2px 0;font-size:1.08rem;line-height:1.2}
#card .sub{font-size:.84rem;color:var(--muted);margin:0 0 6px}
#card p{margin:0 0 10px;font-size:.93rem}
#card .x{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:1.4rem;line-height:1;width:40px;height:40px;cursor:pointer;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;font-size:.93rem;border:0;cursor:pointer;min-height:40px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
#loc{position:absolute;right:10px;top:10px;z-index:900;box-shadow:0 1px 5px rgba(16,27,51,.3)}
.wrapmap{position:relative;flex:1;min-height:0;display:flex}
#empty{padding:28px 20px;max-width:560px;margin:0 auto}
#empty h1{font-size:1.4rem;margin:0 0 8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
 <div class="top"><div class="logo">w<b>AI</b>findr</div><div class="trip" id="trip"></div></div>
 <div id="controls" hidden>
  <label for="day" style="position:absolute;left:-9999px">Day</label>
  <select id="day"></select>
  <div class="chips" id="chips" style="margin-top:8px"></div>
 </div>
</header>
<div class="wrapmap" id="wrapmap">
 <div id="map"></div>
 <button class="btn alt" id="loc" type="button">Where am I?</button>
 <div id="card" role="dialog" aria-live="polite"></div>
</div>
<div id="empty" hidden>
 <h1>No trip to show yet</h1>
 <p>This page draws the live map for a wAIfindr trip. Open it from the Map tab of your wAIfindr app with the <strong>Open live map</strong> button, which sends your places here.</p>
 <p style="color:var(--muted);font-size:.9rem">Your trip details travel in the link itself and stay on your device. Nothing is stored on this site.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
var CATS={sight:"Sights",museum:"Museums",food:"Restaurants",cafe:"Cafés",shop:"Shopping",park:"Parks",transit:"Transport",stay:"Hotels",area:"Neighbourhoods"};
var COL={sight:"#3348D6",museum:"#0B8480",food:"#D2452B",cafe:"#9A5B13",shop:"#B02A86",park:"#2E7D32",transit:"#4A5568",area:"#6B3FC4",stay:"#0E6BA8"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function decode(h){
 h=(h||"").replace(/^#/,"");if(h.indexOf("t=")===0)h=h.slice(2);if(!h)return null;
 try{var b=h.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
  var d=JSON.parse(decodeURIComponent(escape(atob(b))));
  if(!d||!Array.isArray(d.places))return null;
  d.places=d.places.filter(function(p){return p&&typeof p.la==="number"&&typeof p.ln==="number"&&isFinite(p.la)&&isFinite(p.ln);});
  d.days=Array.isArray(d.days)?d.days:[];return d;
 }catch(e){return null;}
}
var T=decode(location.hash),KEY="waifindr.map.last";
try{if(T)localStorage.setItem(KEY,location.hash);else{T=decode(localStorage.getItem(KEY));}}catch(e){}
var st={cat:"all",day:"all",sel:null},map,layer,routeLine,meMark,marks={};

function gmaps(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.q||(p.n+(T.dest?", "+T.dest:"")));}
function dayPlaces(i){var d=T.days[i];if(!d)return[];var out=[];(d.s||[]).forEach(function(id){var p=T.places.filter(function(x){return x.id===id;})[0];if(p&&out.indexOf(p)<0)out.push(p);});return out;}
function visible(){
 var list=st.day==="all"?T.places.slice():dayPlaces(+st.day);
 if(st.cat!=="all")list=list.filter(function(p){return (COL[p.c]?p.c:"area")===st.cat;});
 return list;
}
function icon(p,n,sel){var c=COL[p.c]||COL.area,s=sel?34:n?28:22;
 return L.divIcon({className:"",iconSize:[s,s],iconAnchor:[s/2,s/2],html:'<div class="pin'+(sel?" sel":"")+'" style="width:'+s+'px;height:'+s+'px;background:'+c+'">'+(n||"")+'</div>'});}
function draw(fit){
 layer.clearLayers();marks={};if(routeLine){map.removeLayer(routeLine);routeLine=null;}
 var list=visible(),numbered=st.day!=="all"&&st.cat==="all";
 if(numbered&&list.length>1){routeLine=L.polyline(list.map(function(p){return[p.la,p.ln];}),{color:"#101B33",weight:3,dashArray:"2 9",lineCap:"round"}).addTo(map);}
 list.forEach(function(p,i){var m=L.marker([p.la,p.ln],{icon:icon(p,numbered?i+1:0,st.sel===p.id),title:p.n,alt:p.n,keyboard:true,zIndexOffset:st.sel===p.id?1000:0});
  m.on("click",function(){select(p.id);});m.addTo(layer);marks[p.id]=m;});
 if(fit&&list.length){var b=L.latLngBounds(list.map(function(p){return[p.la,p.ln];}));map.fitBounds(b.pad(.15),{maxZoom:16});}
 card();
}
function select(id){st.sel=st.sel===id?null:id;draw(false);var p=st.sel&&T.places.filter(function(x){return x.id===st.sel;})[0];if(p)map.panTo([p.la,p.ln]);}
function card(){var el=document.getElementById("card"),p=st.sel&&T.places.filter(function(x){return x.id===st.sel;})[0];
 if(!p){el.className="";el.innerHTML="";return;}
 var c=COL[p.c]?p.c:"area";
 el.innerHTML='<button class="x" type="button" aria-label="Close" id="cx">×</button><h2>'+esc(p.n)+'</h2><p class="sub"><span style="color:'+COL[c]+';font-weight:700">'+CATS[c]+'</span>'+(p.a?" · "+esc(p.a):"")+(p.by?" · picked by "+esc(p.by):"")+'</p>'+(p.o?'<p>'+esc(p.o)+'</p>':"")+
  '<div class="row"><a class="btn" href="'+gmaps(p)+'" target="_blank" rel="noopener">Open in Google Maps</a>'+(/^https?:\/\//i.test(p.u||"")?'<a class="btn alt" href="'+esc(p.u)+'" target="_blank" rel="noopener">'+esc(p.ul||"Website")+'</a>':"")+'</div>';
 el.className="on";document.getElementById("cx").onclick=function(){st.sel=null;draw(false);};}
function chips(){var base=st.day==="all"?T.places:dayPlaces(+st.day),have=Object.keys(CATS).filter(function(c){return base.some(function(p){return (COL[p.c]?p.c:"area")===c;});});
 if(st.cat!=="all"&&have.indexOf(st.cat)<0)st.cat="all";
 document.getElementById("chips").innerHTML=["all"].concat(have).map(function(c){return '<button type="button" class="chip'+(st.cat===c?" on":"")+'" data-c="'+c+'">'+(c==="all"?"Everything":'<i style="background:'+COL[c]+'"></i>'+CATS[c])+'</button>';}).join("");}
function start(){
 document.getElementById("trip").textContent=T.name||"";document.title=(T.name?T.name+" · ":"")+"wAIfindr live map";
 document.getElementById("controls").hidden=false;
 var sel=document.getElementById("day");
 sel.innerHTML='<option value="all">All days, all places</option>'+T.days.map(function(d,i){return '<option value="'+i+'">Day '+(i+1)+(d.l?" · "+esc(d.l):"")+": "+esc(d.t||"")+'</option>';}).join("");
 if(typeof T.day==="number"&&T.days[T.day]){st.day=String(T.day);sel.value=st.day;}
 map=L.map("map",{zoomControl:false});L.control.zoom({position:"bottomright"}).addTo(map);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
 layer=L.layerGroup().addTo(map);map.setView([48.8589,2.347],12);
 map.on("click",function(){if(st.sel){st.sel=null;draw(false);}});
 chips();draw(true);
 sel.onchange=function(){st.day=sel.value;st.sel=null;chips();draw(true);};
 document.getElementById("chips").onclick=function(e){var b=e.target.closest("[data-c]");if(!b)return;st.cat=b.getAttribute("data-c");st.sel=null;chips();draw(true);};
 var loc=document.getElementById("loc");
 if(!navigator.geolocation){loc.hidden=true;}
 loc.onclick=function(){loc.textContent="Finding you…";
  navigator.geolocation.getCurrentPosition(function(g){loc.textContent="Where am I?";var ll=[g.coords.latitude,g.coords.longitude];
   if(meMark)map.removeLayer(meMark);meMark=L.marker(ll,{icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],html:'<div class="me"></div>'}),title:"You are here",zIndexOffset:2000}).addTo(map);map.setView(ll,Math.max(map.getZoom(),15));},
   function(){loc.textContent="Location is off";setTimeout(function(){loc.textContent="Where am I?";},2500);},{enableHighAccuracy:true,timeout:10000});};
}
if(T&&T.places.length&&window.L)start();
else{document.getElementById("wrapmap").style.display="none";document.getElementById("empty").hidden=false;}
window.addEventListener("hashchange",function(){location.reload();});
</script>
</body>
</html>
