/* A friendly travel notebook: navy bar with the bouncy logo, one sunny yellow accent, place types colour-coded like transit lines. */
:root{--paper:#F3F5FA;--surface:#fff;--sunk:#E8ECF4;--ink:#13203B;--muted:#55617A;--line:#D7DDE9;--sun:#FFC83D;--sun-bg:#FFF3CC;--brand:#2447C7;--pop:#EE5A3A;--ok:#18794E;--ok-bg:#E3F4EC;
 --c-sight:#3348D6;--c-museum:#0B8480;--c-food:#D2452B;--c-cafe:#9A5B13;--c-shop:#B02A86;--c-park:#2E7D32;--c-transit:#4A5568;--c-area:#6B3FC4;--c-stay:#0E6BA8;
 --display:"Fredoka","Avenir Next Rounded","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
 --r:16px;--shadow:0 1px 2px rgba(19,32,59,.06),0 6px 20px rgba(19,32,59,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}

h2{font-size:1.35rem}
h3{font-size:1.05rem}
a{color:var(--brand)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}.small{font-size:.875rem}.num{font-variant-numeric:tabular-nums}
.kick{font-family:var(--body);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
header{background:var(--ink);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:12px;flex:none}
.logo{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1;color:#fff;display:inline-flex;align-items:flex-end;padding:8px 2px 2px;white-space:nowrap}
.logo span{display:inline-block}
.logo .lai{color:var(--sun)}
.logo .l1{transform:rotate(-6deg) translateY(1px)}.logo .l2{transform:rotate(4deg) translateY(-2px)}.logo .l3{transform:rotate(-3deg) translateY(1px)}.logo .l4{transform:rotate(5deg) translateY(-1px)}.logo .l6{transform:rotate(-4deg) translateY(-1px)}.logo .l7{transform:rotate(3deg) translateY(1px)}.logo .l8{transform:rotate(-5deg)}
.logo .pini{width:.19em;height:.5em;background:currentColor;border-radius:.1em;margin:0 .07em .135em;position:relative}
.logo .pini svg{position:absolute;left:50%;bottom:calc(100% + .05em);width:.42em;height:.54em;margin-left:-.21em}
.trip{flex:1;min-width:0;text-align:right;line-height:1.25}
.trip strong{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:.72rem;font-weight:600;color:var(--muted);border-top:3px solid transparent;margin-top:-1px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);border-top-color:var(--sun)}

.card.today{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-bg),var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.days,.hours,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}

.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun)}

.btn svg{width:16px;height:16px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.stop.next .time{color:var(--pop)}

.sname{font-weight:700;display:block;overflow-wrap:anywhere}
.smeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chev{margin-left:auto;color:var(--muted);flex:none}
.chev svg{width:16px;height:16px}
.open .chev svg{transform:rotate(180deg)}
.sdetail{padding:2px 8px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.n{color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}

.badge svg{width:13px;height:13px;flex:none}

.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.84rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none;color:var(--ink);white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
.links a.main{background:var(--brand);border-color:var(--brand);color:#fff}

.alts{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.logbox{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
summary{cursor:pointer;font-weight:600;font-family:var(--display);padding:14px 0}

.idea:first-child{border-top:0}
.eatrow{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.eatrow:first-child{border-top:0;padding-top:2px}
.topline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.when{font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--ink);color:#fff}

.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer;color:var(--muted);min-height:36px}

.code{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;word-break:break-all}
/* map */
#mapview{display:none;flex-direction:column;height:100%}
#mapview.on{display:flex}
.mapctl{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:8px;flex:none}

.mapwrap{position:relative;flex:1;min-height:260px}
#map,#rmap{background:#E4E9EF}
#map{position:absolute;inset:0}

var WMO=function(c){return c===0?"Clear":c<=2?"Partly cloudy":c===3?"Cloudy":c<=48?"Fog":c<=57?"Drizzle":c<=67?"Rain":c<=77?"Snow":c<=82?"Showers":c<=86?"Snow showers":"Thunderstorm";};

function wxGet(c){var k=wxKey(c);if(WX[k])return WX[k].p;
 var u="https://api.open-meteo.com/v1/forecast?latitude="+c.lat.toFixed(3)+"&longitude="+c.lng.toFixed(3)+"&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=16";
 WX[k]={p:fetch(u).then(function(r){if(!r.ok)throw new Error("wx");return r.json();}).then(function(d){WX[k].d=d;return d;})};WX[k].p.catch(function(){delete WX[k];});return WX[k].p;}

 var seen={},jobs=[];T.days.forEach(function(d,i){var c=dayCenter(i);if(!c)return;var k=wxKey(c);(seen[k]=seen[k]||{c:c,dates:[]}).dates.push(d.date);});
 Object.keys(seen).slice(0,4).forEach(function(k){jobs.push(wxGet(seen[k].c).then(function(d){var D=d.daily||{};(D.time||[]).forEach(function(t,j){if(seen[k].dates.indexOf(t)>=0&&D.temperature_2m_max[j]!=null)wxLive[t]={date:t,hi:D.temperature_2m_max[j],lo:D.temperature_2m_min[j],rain:D.precipitation_probability_max?D.precipitation_probability_max[j]:null,kind:"live"};});}).catch(function(){}));});
 Promise.all(jobs).then(function(){if(Object.keys(wxLive).length&&ui.view!=="map")render();});}
function hoursHtml(i){var c=dayCenter(i);if(!c)return "";var w=WX[wxKey(c)],d=w&&w.d;
 if(!d){if(!w)wxGet(c).then(function(){if(ui.view==="today")render();}).catch(function(){var el=document.getElementById("hours");if(el)el.innerHTML='<p class="small muted">The live forecast could not load. Check your connection.</p>';});return '<div id="hours"><p class="small muted">Loading the hourly forecast…</p></div>';}
 var H=d.hourly||{},now=new Date(Date.now()+((d.utc_offset_seconds||0)*1000)).toISOString().slice(0,13)+":00",k=(H.time||[]).indexOf(now);if(k<0)return "";
 var out="";for(var j=k;j<Math.min(k+14,H.time.length);j++){var hh=+H.time[j].slice(11,13),pr=H.precipitation_probability?H.precipitation_probability[j]:null;
  out+='<div class="hr'+(pr>=50?" wet":"")+(j===k?" first":"")+'"><span>'+(j===k?"Now":(hh%12||12)+(hh>=12?" PM":" AM"))+'</span><b class="num">'+Math.round(H.temperature_2m[j])+'°</b><span class="p">'+(pr!=null?pr+"% rain":"")+'</span><span>'+WMO(H.weather_code[j])+'</span></div>';}
 return '<div id="hours"><div class="hours">'+out+'</div><p class="small muted">Live forecast from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.</p></div>';}

function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}

  (planned.length?'<section class="card"><h3 class="kick">In your plan, in order</h3>'+planned.map(row).join("")+'</section>':"")+
  (more.length?'<section class="card"><h3 class="kick">More options</h3>'+more.map(row).join("")+'</section>':"")+
  (!eats.length?'<div class="card muted">No restaurants in this trip yet.</div>':"");}
function vPrep(){
 var key=ui.prep==="pack"?"packing":"todos",items=T[key]||[],done=items.filter(function(i){return i.done;}).length,groups=[];
 function g(i){return key==="packing"?((i.wn&&i.wn!=="Shared"?i.wn+" · ":"")+(i.cat||"Other")):(i.when||"Other");}
 items.forEach(function(i){if(groups.indexOf(g(i))<0)groups.push(g(i));});
 var cols=groups.map(function(gr){var gi=items.filter(function(i){return g(i)===gr;});
  return '<section class="card"><h3 style="display:flex;justify-content:space-between;margin-bottom:6px">'+esc(gr)+'<span class="small muted num" style="font-weight:500;font-family:var(--body)">'+gi.filter(function(i){return i.done;}).length+'/'+gi.length+'</span></h3>'+gi.map(function(i){var n=items.indexOf(i);return '<div class="item'+(i.done?" done":"")+'"><input type="checkbox" id="c'+n+'" data-k="'+key+'" data-n="'+n+'"'+(i.done?" checked":"")+'><label for="c'+n+'">'+esc((i.qty>1?i.qty+" × ":"")+i.text)+'</label>'+(safe(i.u)?'<a href="'+esc(i.u)+'" target="_blank" rel="noopener">'+esc(i.ul||"Open")+'</a>':"")+'</div>';}).join("")+'</section>';}).join("");
 return '<div class="seg" role="group" aria-label="List"><button class="'+(ui.prep==="todo"?"on":"")+'" data-act="prep" data-k="todo">To-do</button><button class="'+(ui.prep==="pack"?"on":"")+'" data-act="prep" data-k="pack">Packing</button></div>'+
  '<div class="row"><h2 style="flex:1">'+(key==="packing"?"Packing list":"Before you go")+'</h2><div class="bar"><i style="width:'+(items.length?Math.round(done/items.length*100):0)+'%"></i></div><span class="small num">'+done+' of '+items.length+'</span></div>'+
  (key==="packing"&&T.wxNote?'<div class="note"><strong>Packed for the weather.</strong> '+esc(T.wxNote)+'</div>':"")+cols+
  '<p class="small muted">Ticks are saved on this phone. To add or change items, edit the plan in Claude and open the trip app again; your ticks and notes are kept.</p>'+copyCard();}
function vRecs(){var ps=R.places||[],yes=ps.filter(function(p){return p.rec;}),next=ps.filter(function(p){return !p.rec;});
 function row(p){return '<div class="idea"><div class="topline"><strong>'+esc(p.name)+'</strong>'+(p.r?'<span class="badge star">'+"★★★★★".slice(0,p.r)+'</span>':"")+'<span class="badge" style="background:'+COL[cat(p.cat)]+';color:#fff;padding-left:8px">'+CATS[cat(p.cat)]+'</span></div>'+(p.area?'<span class="small muted">'+esc(p.area)+'</span>':"")+(p.o?'<p class="small">'+esc(p.o)+'</p>':"")+links(p)+'</div>';}
 return '<section class="stack"><p class="kick">Recommendations from '+esc(R.from||"a friend")+'</p><h2>'+esc(R.name||"Trip picks")+'</h2>'+(R.dest?'<p class="muted">'+esc(R.dest)+'</p>':"")+'</section><div id="rmap"></div>'+
  (yes.length?'<section class="card"><h3 class="kick">Would recommend</h3>'+yes.map(row).join("")+'</section>':"")+(next.length?'<section class="card"><h3 class="kick">On the list for next time</h3>'+next.map(row).join("")+'</section>':"")+
  '<p class="small muted">Made with wAIfindr. Every place opens in Google Maps.</p>';}
function recMap(){if(!window.L)return;var ps=(R.places||[]).filter(hasLL);if(!ps.length){document.getElementById("rmap").style.display="none";return;}
 var m=L.map("rmap",{zoomControl:true});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m);
 ps.forEach(function(p){L.marker([p.lat,p.lng],{icon:pinIcon(p,0,false),title:p.name,alt:p.name}).addTo(m).bindPopup('<strong>'+esc(p.name)+'</strong><br><a href="'+gmaps(p)+'" target="_blank" rel="noopener">Open in Google Maps</a>');});
 m.fitBounds(L.latLngBounds(ps.map(function(p){return[p.lat,p.lng];})).pad(.2),{maxZoom:15});}

/* ---------- map ---------- */
function mapList(){var l=ui.mapDay==="all"?T.places.filter(hasLL):dayPlaces(+ui.mapDay).filter(function(p,i,a){return a.indexOf(p)===i;});
 if(ui.mapCat!=="all")l=l.filter(function(p){return cat(p.cat)===ui.mapCat;});return l;}
function pinIcon(p,n,sel){var s=sel?34:n?28:22;return L.divIcon({className:"",iconSize:[s,s],iconAnchor:[s/2,s/2],html:'<div class="pin'+(sel?" sel":"")+'" style="width:'+s+'px;height:'+s+'px;background:'+COL[cat(p.cat)]+'">'+(n||"")+'</div>'});}
function mapChips(){var base=ui.mapDay==="all"?T.places.filter(hasLL):dayPlaces(+ui.mapDay),have=Object.keys(CATS).filter(function(c){return base.some(function(p){return cat(p.cat)===c;});});
 if(ui.mapCat!=="all"&&have.indexOf(ui.mapCat)<0)ui.mapCat="all";
 document.getElementById("mchips").innerHTML=["all"].concat(have).map(function(c){return '<button type="button" class="chip'+(ui.mapCat===c?" on":"")+'" data-c="'+c+'">'+(c==="all"?"Everything":'<i style="background:'+COL[c]+'"></i>'+CATS[c])+'</button>';}).join("");}
function mapDraw(fit){
 layer.clearLayers();if(routeLine){map.removeLayer(routeLine);routeLine=null;}
 var list=mapList(),numbered=ui.mapDay!=="all"&&ui.mapCat==="all";
 if(numbered&&list.length>1)routeLine=L.polyline(list.map(function(p){return[p.lat,p.lng];}),{color:"#13203B",weight:3,dashArray:"2 9",lineCap:"round"}).addTo(map);
 list.forEach(function(p,i){var m=L.marker([p.lat,p.lng],{icon:pinIcon(p,numbered?i+1:0,ui.sel===p.id),title:p.name,alt:p.name,zIndexOffset:ui.sel===p.id?1000:0});
  m.on("click",function(){ui.sel=ui.sel===p.id?null:p.id;mapDraw(false);if(ui.sel)map.panTo([p.lat,p.lng]);});m.addTo(layer);});
 if(fit&&list.length){var fl=list;
  if(ui.mapDay==="all"&&T.regions&&T.regions.length>1){var r0=T.regions[0].id,f=list.filter(function(p){return (p.rg||r0)===r0;});if(f.length)fl=f;}
  map.fitBounds(L.latLngBounds(fl.map(function(p){return[p.lat,p.lng];})).pad(.15),{maxZoom:16});}
 pinCard();}
function pinCard(){var el=document.getElementById("pcard"),p=ui.sel&&place(ui.sel);
 if(!p){el.className="card";el.innerHTML="";return;}var c=cat(p.cat);
 el.innerHTML='<button class="x" type="button" aria-label="Close" data-act="unsel">×</button><h3>'+esc(p.name)+'</h3><p class="small muted"><span style="color:'+COL[c]+';font-weight:700">'+CATS[c]+'</span>'+(p.area?" · "+esc(p.area):"")+'</p><div class="smeta">'+srcB(p)+flagB(p)+logB(p.log)+'</div>'+((p.why||p.note)?'<p class="small" style="margin-top:6px">'+esc(p.why||p.note)+'</p>':"")+(p.approx?'<p class="small muted">Pin shows the neighbourhood, not the exact door.</p>':"")+'<div style="margin-top:8px">'+links(p)+'</div>';
 el.className="card on";}
function mapShow(fit){
 var sel=document.getElementById("mday");
 sel.innerHTML='<option value="all">All days, all places</option>'+T.days.map(function(d,i){return '<option value="'+i+'">'+esc(fmt(d.date,{weekday:"short",day:"numeric"}))+": "+esc(d.title||"")+'</option>';}).join("");
 sel.value=ui.mapDay;mapChips();
 if(!window.L){document.getElementById("map").innerHTML='<p style="padding:20px">The map could not load. Check your internet connection and reload.</p>';return;}
 if(!map){map=L.map("map",{zoomControl:false});L.control.zoom({position:"bottomright"}).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  layer=L.layerGroup().addTo(map);map.setView([48.8589,2.347],12);map.on("click",function(){if(ui.sel){ui.sel=null;mapDraw(false);}});fit=true;}
 setTimeout(function(){map.invalidateSize();mapDraw(fit);},0);}

/* ---------- chrome ---------- */
function tabs(){return [["today",phase()==="live"?"Today":"Overview"],["plan","Itinerary"],["map","Map"],["eat","Eat"],["prep","Prep"]];}
function render(){
 var v=document.getElementById("view"),mv=document.getElementById("mapview"),nav=document.getElementById("tabs");
 if(R){nav.style.display="none";mv.className="";v.style.display="";document.getElementById("trip").innerHTML=T?'<a href="./" style="color:#fff;font-size:.86rem;font-weight:600">Back to my trip</a>':"";document.title=(R.name?R.name+" picks · ":"")+"wAIfindr";v.innerHTML=vRecs();recMap();return;}
 if(!T){nav.style.display="none";mv.className="";v.style.display="";
  v.innerHTML='<div class="card"><h2>No trip here yet</h2><p style="margin-top:8px">Open your wAIfindr planner in Claude, open a trip and tap <strong>Open trip app</strong>. That sends your trip to this page.</p><p class="small muted" style="margin-top:8px">Your trip travels in the link and is kept on this phone only. Nothing is stored on this site.</p></div>';return;}
 nav.innerHTML=tabs().map(function(t){return '<button class="tab'+(ui.view===t[0]?" on":"")+'" data-tab="'+t[0]+'"'+(ui.view===t[0]?' aria-current="page"':"")+'>'+svg(t[0])+t[1]+'</button>';}).join("");
 document.getElementById("trip").innerHTML='<strong>'+esc(T.name||"")+'</strong><span>'+esc(fmt(T.start,{month:"short",day:"numeric"}))+" to "+esc(fmt(T.end,{month:"short",day:"numeric"}))+" · "+esc(countdown())+'</span>';
 document.title=(T.name?T.name+" · ":"")+"wAIfindr";
 if(ui.view==="map"){v.style.display="none";mv.className="on";mapShow(false);}
 else{mv.className="";v.style.display="";v.innerHTML=ui.view==="eat"?vEat():ui.view==="prep"?vPrep():ui.view==="plan"?vPlan():vToday();
  if(ui.view==="plan"){var on=document.querySelector(".day.on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});}}}
function keep(fn){var m=document.getElementById("main"),y=m.scrollTop;fn();save();render();m.scrollTop=y;}
document.addEventListener("click",function(e){
 var tb=e.target.closest("[data-tab]");if(tb){ui.view=tb.getAttribute("data-tab");render();document.getElementById("main").scrollTop=0;return;}
 var ch=e.target.closest("#mchips [data-c]");if(ch){ui.mapCat=ch.getAttribute("data-c");ui.sel=null;mapChips();mapDraw(true);return;}
 var el=e.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act"),id=el.getAttribute("data-id"),s=id&&T&&findStop(id);
 if(a==="day"){ui.day=+el.getAttribute("data-i");render();}
 else if(a==="map-day"){ui.mapDay=el.getAttribute("data-i");ui.mapCat="all";ui.sel=null;ui.view="map";render();setTimeout(function(){if(map)mapDraw(true);},30);}
 else if(a==="prep"){ui.prep=el.getAttribute("data-k");render();}
 else if(a==="unsel"){ui.sel=null;mapDraw(false);}
 else if(a==="stop"){var m=document.getElementById("main"),y=m.scrollTop;ui.open[id]=!ui.open[id];render();m.scrollTop=y;}
 else if(a==="status"&&s){keep(function(){var l=logTouch(s),v=el.getAttribute("data-s");l.status=l.status===v?"":v;});}
 else if(a==="rate"&&s){keep(function(){var l=logTouch(s),n=+el.getAttribute("data-n");l.rating=l.rating===n?0:n;});}
 else if(a==="rec"&&s){keep(function(){var l=logTouch(s),v=el.getAttribute("data-v")==="1";l.rec=l.rec===v?null:v;});}
 else if(a==="again"&&s){keep(function(){var l=logTouch(s);l.again=!l.again;});}
 else if(a==="near"){ui.nearMsg="Finding you…";render();locate(function(ll){ui.near=ll;ui.nearMsg="";render();},function(){ui.nearMsg="Location is off for this page. Allow it in your browser settings and try again.";render();});}
 else if(a==="near-cat"){var mm=document.getElementById("main"),yy=mm.scrollTop;ui.nearCat=el.getAttribute("data-c");render();mm.scrollTop=yy;}
 else if(a==="copy-notes"){notesCode().then(function(code){ui.code=code;var done=function(ok){ui.copyMsg=ok?"Copied. Paste it into the planner.":"Select the text below and copy it.";var m=document.getElementById("main"),y=m.scrollTop;render();m.scrollTop=y;var b=document.getElementById("codebox");if(b&&!ok){b.focus();b.select();}};
   try{navigator.clipboard.writeText(code).then(function(){done(true);},function(){done(false);});}catch(x){done(false);}});}
});
document.addEventListener("change",function(e){var el=e.target;
 if(el.id==="mday"){ui.mapDay=el.value;ui.sel=null;mapChips();mapDraw(true);}
 else if(el.getAttribute("data-log")){var s=findStop(el.getAttribute("data-id"));if(s){logTouch(s)[el.getAttribute("data-log")]=el.value.slice(0,600);save();}}
 else if(el.type==="checkbox"&&el.getAttribute("data-k")){var it=(T[el.getAttribute("data-k")]||[])[+el.getAttribute("data-n")];if(it){it.done=el.checked;var m=document.getElementById("main"),y=m.scrollTop;save();render();m.scrollTop=y;}}});
document.getElementById("loc").onclick=function(){var b=this;if(!navigator.geolocation||!map){b.textContent="Location unavailable";return;}b.textContent="Finding you…";
 locate(function(g){b.textContent="Where am I?";ui.near=g;var ll=[g.lat,g.lng];if(meMark)map.removeLayer(meMark);
  meMark=L.marker(ll,{icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],html:'<div class="me"></div>'}),title:"You are here",zIndexOffset:2000}).addTo(map);map.setView(ll,Math.max(map.getZoom(),15));},
  function(){b.textContent="Location is off";setTimeout(function(){b.textContent="Where am I?";},2500);});};

/* ---------- loading a trip from the link ---------- */
function bytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function unpack(hash){var parts=String(hash||"").replace(/^#/,"").split(".");
 if(parts.length<4||!parts[3])return Promise.resolve(null);
 var u;try{u=bytes(parts[3]);}catch(e){return Promise.resolve(null);}
 var txt=parts[0]==="z"?(typeof DecompressionStream==="undefined"?Promise.reject(new Error("old")):new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()):Promise.resolve(new TextDecoder().decode(u));
 return txt.then(function(t){var d=JSON.parse(t);if(d&&d.recs&&Array.isArray(d.recs.places))return {recs:d.recs};if(!d||!d.trip||!Array.isArray(d.trip.days))return null;return {view:parts[1],day:parts[2],stamp:String(d.stamp||""),trip:d.trip};});}
function norm(t){t.places=Array.isArray(t.places)?t.places:[];t.days=(t.days||[]).map(function(d){d.stops=Array.isArray(d.stops)?d.stops:[];return d;});t.todos=Array.isArray(t.todos)?t.todos:[];t.packing=Array.isArray(t.packing)?t.packing:[];return t;}
/* a newer plan replaces the old one, but ticks, ratings and notes made on this phone are kept */
function adopt(inc){var old=T;T=norm(inc.trip);stamp=inc.stamp;
 if(old&&(old.id?old.id===T.id:old.name===T.name)){
  ["todos","packing"].forEach(function(k){var m={},mi={};(old[k]||[]).forEach(function(i){if(i.done){m[i.text]=1;if(i.id)mi[i.id]=1;}});T[k].forEach(function(i){if((i.id&&mi[i.id])||m[i.text])i.done=true;});});
  var newer=function(a,b){return a&&a.ts&&(!b||!b.ts||a.ts>b.ts);};
  var pl={};old.places.forEach(function(p){if(p.log)pl[p.id]=p.log;});T.places.forEach(function(p){if(newer(pl[p.id],p.log))p.log=pl[p.id];});
  var sl={};old.days.forEach(function(d){d.stops.forEach(function(s){if(s.log&&s.id)sl[s.id]=s.log;});});T.days.forEach(function(d){d.stops.forEach(function(s){if(s.id&&newer(sl[s.id],s.log))s.log=sl[s.id];});});}
 save();}
function firstDay(){var i=todayIdx();return i<0?0:i;}
(function boot(){
 try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.trip&&Array.isArray(s.trip.days)){T=norm(s.trip);stamp=String(s.stamp||"");}}catch(e){}
 function go(inc){if(inc&&inc.recs){R=inc.recs;render();return;}
  if(inc&&inc.stamp!==stamp)adopt(inc);
  if(T){ui.day=firstDay();if(inc){if(/^(today|plan|map|eat|prep)$/.test(inc.view))ui.view=inc.view;if(/^\d+$/.test(inc.day)&&T.days[+inc.day]){ui.day=+inc.day;ui.mapDay=inc.day;}}}
  render();wxLoadTrip();}
 unpack(location.hash).then(go,function(){go(null);if(!T)document.getElementById("view").innerHTML='<div class="card"><h2>This browser is too old to open the trip</h2><p style="margin-top:8px">Update your browser, or open the link in Safari or Chrome.</p></div>';});
})();
window.addEventListener("hashchange",function(){location.reload();});
</script>
